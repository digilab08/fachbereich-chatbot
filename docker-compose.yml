services:
  moodle-dl:
    build:
      context: ./moodle-dl
      dockerfile: Dockerfile
    container_name: moodle-dl
    volumes:
      - moodle-data:/files
    labels:
      ofelia.enabled: "true"
      ofelia.job-run.moodle-sync.schedule: "0 3 * * *"
      ofelia.job-run.moodle-sync.container: "moodle-dl"

  # Optional but recommended to store the config csv files.
  # If you don't want to store them in Sciebo, you can remove the volume and and bind the config files directly to the container ETL-Worker and MCP-Server.
  sciebo-sync:
    image: rclone/rclone:latest
    container_name: sciebo-sync
    environment:
      - NC_URL=${NC_URL}
      - NC_USER=${NC_USER}
      - NC_PASS=${NC_PASS}
      - NC_SUBFOLDER=${NC_SUBFOLDER}
    volumes:
      - sciebo-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[$(date)] Running initial startup sync..."
        OBSCURED_PASS=$$(rclone obscure "$$NC_PASS")
        rclone sync ":webdav,url='$${NC_URL}',user='$${NC_USER}',pass='$${OBSCURED_PASS}',vendor='owncloud':$${NC_SUBFOLDER}" /data --verbose --create-empty-src-dirs
        echo "[$(date)] Sync finished. Waiting for Ofelia schedule..."
    labels:
      ofelia.enabled: "true"
      ofelia.job-run.rclone-sync.schedule: "0 3 * * *"
      ofelia.job-run.rclone-sync.container: "sciebo-sync"

  etl-worker:
    build:
      context: ./ETL-worker
      dockerfile: Dockerfile
    container_name: etl-worker
    volumes:
      - moodle-data:/app/data/moodle
      - sciebo-data:/app/config
      - processed-data:/app/processed-data
    environment:
      # Change LOG_LEVEL to DEBUG for more verbose logging
      - LOG_LEVEL=INFO
      - EXTRACTION_CONFIG_PATH=config/extraction_config.csv
      - DATA_PATH=data
      - PROCESSED_FOLDER_PATH=processed-data
      - MOODLE_URL=${MOODLE_URL}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=chatbot-collection
    depends_on:
      - qdrant
    command: >
      sh -c '
        echo "[$(date)] Waiting for 15 minutes before starting ETL process..." &&
        sleep 900 &&
        echo "[$(date)] Starting ETL process..." &&
        python src/main.py
      '
    labels:
      ofelia.enabled: "true"
      ofelia.job-run.rclone-sync.schedule: "0 3 * * *"
      ofelia.job-run.rclone-sync.container: "sciebo-sync"

  mcp-server:
    build:
      context: ./MCP-server
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "9001:9001"
    volumes:
      - processed-data:/app/data
      - sciebo-data:/app/config
    environment:
      - LOG_LEVEL=INFO
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=chatbot-collection
      - DENSE_MODEL_NAME=jinaai/jina-embeddings-v3
      - SPARSE_MODEL_NAME=Qdrant/bm25
      - DATA_DIR=data
      - CONFIG_DIR=config
      - MCP_SERVER_NAME=${MCP_SERVER_NAME}
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: always
    ports:
      # REST API
      - "6333:6333"
      # gRPC API
      - "6334:6334"
    volumes:
      # Persist data locally in the ./qdrant_data folder
      - qdrant-data:/qdrant/storage

  # Testing purposes only, remove in production

  # mongodb:
